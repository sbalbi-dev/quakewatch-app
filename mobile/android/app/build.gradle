plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

android {
    namespace "com.sebas.quakewatch"
    // Hardcodeado en 37 (en vez de flutter.compileSdkVersion, que hoy da 36)
    // porque permission_handler_android pide compilar contra SDK 37 o
    // superior. Es seguro subirlo: compileSdk es retrocompatible.
    compileSdk 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // flutter_local_notifications requiere Java 8+ APIs desugarizadas
        // para poder compilar contra versiones viejas de Android.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Applicationid usado para publicar en Play Store. Cambialo si vas a
        // registrar el proyecto de Firebase con otro paquete.
        applicationId "com.sebas.quakewatch"
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // TODO: agregar firma de release propia antes de publicar en Play Store.
            // Por ahora firma con la key de debug para que el APK de CI sea instalable.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

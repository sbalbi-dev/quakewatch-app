name: quakewatch
description: "Alertas de terremotos y clima según tu ubicación."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2

  # Location
  geolocator: ^14.0.0
  permission_handler: ^13.0.1

  # State management
  provider: ^6.1.2

  # Local persistence (thresholds, last known position, cached lists)
  shared_preferences: ^2.3.3

  # Push notifications
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

  # Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
